[project]
name = "audiovis"
version = "0.1.0"
description = "A live microphone spectrogram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2,<3",
    "pyqtgraph>=0.13.7,<0.15",
    "PySide6>=6.8,<7",
    "pysysaudio==0.1.3 ; sys_platform == 'darwin' or sys_platform == 'win32'",
    "sounddevice>=0.5,<0.6",
]

[project.scripts]
audiovis = "audiovis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8", "ruff>=0.11"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pyqtgraph.*", "sounddevice.*", "pysysaudio.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

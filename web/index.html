<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000004">
<title>Audiovis</title>
<style>
/* Layout: the spectrogram fills the window edge to edge, with a thin bar above and below.
   app.js overrides every color token from the selected colormap. */
:root {
  --bg: #000004;
  --fg: #f4f6fa;
  --muted: #b0b1b4;
  --panel: #18181d;
  --line: #3b3b3f;
  --accent: #fcfdbf;
  --accent-ink: #000000;
  --bad: #ffb4a6;
  --ramp: none;
  --gutter-left: max(16px, env(safe-area-inset-left, 0px));
  --gutter-right: max(16px, env(safe-area-inset-right, 0px));
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--sans);
  transition: background-color 0.2s ease, color 0.2s ease;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.stage { display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: 420px; }
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding-block: 12px;
  padding-left: var(--gutter-left);
  padding-right: var(--gutter-right);
}
h1 { margin: 0 10px 0 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.resolution { margin: 0 10px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.field { min-width: 0; }
.field.grow { flex: 1 1 200px; max-width: 340px; }
select, button {
  font: inherit;
  font-size: 13px;
  color: var(--fg);
  background: var(--panel);
  border: 0;
  border-radius: 8px;
  padding: 6px 10px;
  max-width: 100%;
}
.field.grow select, .choices select { width: 100%; }
select option { background: var(--panel); color: var(--fg); }
button { cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { background: var(--line); }
button:disabled { opacity: 0.4; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.push { margin-left: auto; }
/* Fixed columns keep the sliders lined up in a row or stacked. */
.knobs { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.knob {
  display: grid;
  grid-template-columns: 5.2em 88px 3.9em;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
}
.knob input { width: 100%; margin: 0; accent-color: var(--accent); }
.knob output { color: var(--fg); font-variant-numeric: tabular-nums; text-align: right; }
:is(select, button, input, a, code):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.plot { position: relative; flex: 1; min-height: 0; }
canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.prompt {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  padding: 16px 16px 40px 74px;
  color: var(--muted);
  pointer-events: none;
}
.prompt p { margin: 0; }
.prompt strong { display: block; color: var(--fg); font-size: 18px; font-weight: 600; }

.foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 20px;
  padding-block: 8px 12px;
  padding-left: var(--gutter-left);
  padding-right: var(--gutter-right);
  font-size: 12px;
  color: var(--muted);
}
#status { flex: 1 1 260px; min-width: 0; margin: 0; overflow-wrap: anywhere; }
#status[data-state="live"] { color: var(--accent); }
#status[data-state="error"] { color: var(--bad); }
.legend { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.ramp { width: 96px; height: 6px; border-radius: 3px; background: var(--ramp); }
.foot a { color: var(--muted); }

#setup {
  display: grid;
  gap: 14px;
  padding-block: 32px 56px;
  padding-left: var(--gutter-left);
  padding-right: var(--gutter-right);
  scroll-margin-top: 0;
}
#setup h2 { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; }
.choices { display: flex; flex-wrap: wrap; gap: 10px; }
.choices .field { display: grid; gap: 3px; flex: 0 1 200px; }
.choices label { color: var(--muted); font-size: 12px; }
.guide { display: grid; gap: 12px; max-width: 68ch; min-width: 0; }
.guide p { margin: 0; }
.guide .verdict { font-weight: 600; }
.guide ol { margin: 0; padding-left: 1.5em; display: grid; gap: 8px; }
.guide ol li::marker { color: var(--muted); font-variant-numeric: tabular-nums; }
.guide .note { color: var(--muted); font-size: 13px; }
.command { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; min-width: 0; }
.command code {
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  white-space: pre;
  font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  background: var(--panel);
  border-radius: 8px;
  padding: 6px 10px;
}
.downloads { display: flex; flex-wrap: wrap; gap: 8px; }
.downloads a {
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}
@media (prefers-reduced-motion: reduce) {
  body { transition: none; }
}
</style>
</head>
<body>
<div class="stage">
  <header class="bar">
    <h1>Audiovis</h1>
    <p id="resolution" class="resolution"></p>
    <div class="field grow">
      <label class="sr-only" for="source">Audio source</label>
      <select id="source"></select>
    </div>
    <button id="start" class="primary" type="button">Start</button>
    <button id="stop" type="button" disabled>Stop</button>
    <div class="field push">
      <label class="sr-only" for="colormap">Colormap</label>
      <select id="colormap" title="Colormap"></select>
    </div>
    <div class="knobs">
      <div class="knob" title="Keeps total brightness constant. Lower spreads it evenly, higher gathers it into the peaks. Double-click to reset.">
        <label for="sharpness">Sharpness</label>
        <input id="sharpness" type="range" min="-3" max="3" step="0.05" value="0">
        <output id="sharpness-value" for="sharpness">1.00</output>
      </div>
      <div class="knob" title="How much history the plot shows.">
        <label for="seconds">Time</label>
        <input id="seconds" type="range" min="2" max="60" step="1" value="10">
        <output id="seconds-value" for="seconds">10 s</output>
      </div>
      <div class="knob" title="The highest frequency shown.">
        <label for="top">Freq</label>
        <input id="top" type="range" min="1000" max="24000" step="500" value="20000">
        <output id="top-value" for="top">20 kHz</output>
      </div>
    </div>
  </header>

  <div class="plot">
    <canvas id="plot" role="img" aria-label="Scrolling spectrogram. Time runs left to right, with frequency increasing upward."></canvas>
    <div id="prompt" class="prompt">
      <p><strong id="prompt-title">Press Start to listen</strong><span id="prompt-detail"></span></p>
    </div>
  </div>

  <footer class="foot">
    <p id="status" role="status">Stopped</p>
    <div class="legend" aria-label="Color scale from minus 90 to 0 dBFS">
      <span>−90</span><div id="ramp" class="ramp"></div><span>0 dBFS</span>
    </div>
    <a href="#setup">Computer audio setup</a>
  </footer>
</div>

<section id="setup" aria-labelledby="setup-title">
  <h2 id="setup-title">Set up computer audio</h2>
  <div class="choices">
    <div class="field">
      <label for="setup-os">Computer</label>
      <select id="setup-os">
        <option value="mac">macOS</option>
        <option value="windows">Windows</option>
        <option value="linux">Linux</option>
        <option value="mobile">Phone or tablet</option>
      </select>
    </div>
    <div class="field">
      <label for="setup-browser">Browser</label>
      <select id="setup-browser">
        <option value="chromium">Chrome or Edge</option>
        <option value="firefox">Firefox</option>
        <option value="safari">Safari</option>
      </select>
    </div>
  </div>
  <div id="guide" class="guide"></div>
</section>
<script src="spectrogram.js"></script>
<script src="app.js"></script>
</body>
</html>
